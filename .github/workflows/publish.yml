name: Publish

# Builds index.json from every record and deploys it to GitHub Pages:
# https://queryahub.github.io/extensions/index.json (what Querya Desktop reads).
# Runs on every merge, every night (an asset that disappeared or changed drops
# out of the index), when Querya Desktop publishes a release (repository_dispatch
# `querya-release` from the app's Release hooks: that version is tested too and
# lands in compat.json), and on demand.
#
# A record that fails its check is left out of the index, an issue is opened for
# it (and closed again when it passes), and the job deploys the rest and then
# fails, so it is noticed.
on:
  repository_dispatch:
    types: [querya-release]
  push:
    branches: [main]
    paths:
      - extensions/**
      - hosts.json
      - scripts/**
      - .github/**
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          # From a dispatch: the Querya version that was just released.
          RELEASED: ${{ github.event.client_payload.version }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, re
          files = sorted(str(p) for p in pathlib.Path("extensions").glob("*.json"))
          hosts = json.load(open("hosts.json"))["hosts"]
          released = os.environ.get("RELEASED", "").strip().lstrip("v")
          if re.fullmatch(r"\d+\.\d+\.\d+", released) and released not in hosts:
              hosts.append(released)
          include = [{"record": f, "host": h} for f in files for h in hosts]
          print("matrix=" + json.dumps({"include": include}))
          print(f"count={len(files)}")
          PY

  test:
    name: ${{ matrix.record }} on ${{ matrix.host }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/test-record
        with:
          record: ${{ matrix.record }}
          host: ${{ matrix.host }}
          soft: "true"
      - name: Keep the result
        if: always()
        env:
          RECORD: ${{ matrix.record }}
          HOST: ${{ matrix.host }}
          RESULT: ${{ steps.t.outputs.result || 'fail' }}
        run: |
          mkdir -p results
          id=$(basename "$RECORD" .json)
          printf '{"id":"%s","host":"%s","result":"%s"}\n' "$id" "$HOST" "$RESULT" > "results/${id}@${HOST}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: results/
          if-no-files-found: error

  index:
    name: Build the index
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failed: ${{ steps.build.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - id: build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p entries site failures
          failed=()
          for record in extensions/*.json; do
            [ -e "$record" ] || continue
            id=$(basename "$record" .json)
            if python3 scripts/registry.py check "$record" --out "entries/$id.json" 2> "failures/$id.txt"; then
              rm -f "failures/$id.txt"
            else
              cat "failures/$id.txt" >&2
              failed+=("$id")
              rm -f "entries/$id.json"
            fi
          done
          python3 - <<'PY'
          import glob, json
          hosts = json.load(open("hosts.json"))["hosts"]
          compat = {}
          for path in sorted(glob.glob("results/*.json")):
              r = json.load(open(path))
              compat.setdefault(r["id"], {})[r["host"]] = r["result"]
              if r["host"] not in hosts:
                  hosts.append(r["host"])
          json.dump({"schema": 1, "hosts": hosts, "extensions": compat},
                    open("compat.json", "w"), indent=2, sort_keys=True)
          PY
          # An extension whose tests failed on every host is not offered.
          python3 - <<'PY'
          import json, os
          compat = json.load(open("compat.json"))["extensions"]
          with open("untestable.txt", "w") as out:
              for id_, hosts in compat.items():
                  if hosts and all(v == "fail" for v in hosts.values()):
                      try:
                          os.remove(f"entries/{id_}.json")
                      except FileNotFoundError:
                          continue
                      print(f"left out (tests fail on every host): {id_}")
                      out.write(id_ + "\n")
                      with open(f"failures/{id_}.txt", "w") as f:
                          f.write("querya-ext-tester failed on every Querya version in hosts.json: "
                                  + ", ".join(sorted(hosts)) + "\nOpen the run's test jobs for the report.\n")
          PY
          while read -r id; do failed+=("$id"); done < untestable.txt
          python3 scripts/registry.py build-index entries --out site --compat compat.json
          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"
          {
            echo "## Registry"
            echo "- records: $(ls extensions/*.json 2>/dev/null | wc -l)"
            echo "- in the index: $(ls entries/*.json 2>/dev/null | wc -l)"
            [ ${#failed[@]} -eq 0 ] || echo "- failed the check and left out: ${failed[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: failures
          path: failures/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: index
    # `test` is skipped when there are no records, and a skipped ancestor skips
    # everything downstream unless the condition says otherwise.
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Issues for records that failed
    needs: [index, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ needs.index.outputs.failed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: failures
          path: failures
        continue-on-error: true
      - name: Open, update and close issues
        shell: bash
        run: |
          set -euo pipefail
          gh label create registry-check --color B60205 \
            --description "A registry record failed its check" 2>/dev/null || true
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # One issue per failing record, never a second while one is open.
          for id in $FAILED; do
            title="Registry check failed: ${id}"
            open=$(gh issue list --label registry-check --state open --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
            [ -z "$open" ] || { echo "#${open} is already open for ${id}"; continue; }
            {
              echo "The record \`extensions/${id}.json\` failed its check and is **not in the index** until it passes."
              echo
              echo '```'
              cat "failures/${id}.txt" 2>/dev/null || echo "(no message was captured)"
              echo '```'
              echo
              echo "Run: ${run_url}"
              echo "This issue closes itself when the record passes again."
            } > body.md
            gh issue create --title "$title" --label registry-check --body-file body.md
          done

          # Close the issues of records that pass again.
          gh issue list --label registry-check --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' | while IFS=$'\t' read -r number title; do
            id="${title#Registry check failed: }"
            case " $FAILED " in
              *" $id "*) ;;
              *) gh issue close "$number" --comment "${id} passes its check again (${run_url})." ;;
            esac
          done

      - name: Fail if a record was left out
        if: env.FAILED != ''
        run: |
          echo "::error::left out of the index: ${FAILED}"
          exit 1
